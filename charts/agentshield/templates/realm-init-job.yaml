{{- /*
  realm-init-job.yaml
  Post-install / post-upgrade Helm hook Job that configures the Keycloak
  `agentshield` realm after the Keycloak pod is ready.

  What it creates:
    • Realm    : agentshield (display name "AgentShield")
    • Client   : registry-api   — confidential, service accounts enabled
    • Client   : envoy-gateway  — public client, used by Envoy JWT filter
    • Client   : agentshield-studio — public SPA client (PKCE)
    • Client   : langfuse       — confidential, SSO for trace links
    • Users    : NONE. Decision 40 — users are created by platform code, never by
                 the chart. registry-api's lifespan bootstraps platform-admin
                 (services/registry-api/bootstrap_admin.py); agent-reviewer is
                 created by the four e2e suites that use it, via POST /api/v1/admin/users.

  Secrets expected (pre-created before Helm install):
    keycloak-admin-password  → key: password         (Keycloak admin)

  Hook policy:
    • Runs after install and upgrade (post-install, post-upgrade)
    • Deleted automatically on success (hook-succeeded)
    • On failure the pod remains for log inspection; operator must delete
      manually or re-run `helm upgrade` to trigger a fresh attempt.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-realm-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-realm-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    # Run after the main Helm resources are applied (on both install and upgrade).
    "helm.sh/hook": post-install,post-upgrade
    # before-hook-creation: delete any Job left over from a PREVIOUS run before
    # creating this one. Without it, `hook-succeeded` alone is a one-shot: a helm
    # upgrade that is interrupted (timed out, Ctrl-C, CI cancellation) never reaches
    # its cleanup, the completed Job survives, and EVERY subsequent upgrade dies with
    #   post-upgrade hooks failed: jobs.batch "agentshield-realm-init" already exists
    # — a deploy path that permanently blocks itself on a transient interruption. That
    # is exactly how it broke: a run killed at a 10-minute cap left the Job behind, and
    # the retry could not create it. Every other hook in this chart (see
    # postgres-pv-retain-hook.yaml) already carries both policies; this one did not.
    #
    # hook-succeeded still keeps the namespace tidy on success. A FAILED Job is still
    # retained for inspection — until the next deploy, which is the window that matters
    # and is strictly better than blocking that deploy outright.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Weight 10 ensures this job runs after any lower-weight hooks (e.g. DB migrations).
    "helm.sh/hook-weight": "10"
spec:
  # Allow up to 3 retries in case Keycloak is briefly unavailable.
  backoffLimit: 3
  # Remove the Job (and its pods) 10 minutes after completion if the
  # hook-delete-policy hasn't already cleaned it up.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: {{ .Release.Name }}-realm-init
      labels:
        app.kubernetes.io/name: keycloak-realm-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure

      # ── Init container: wait for Keycloak to become reachable ────────────────
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              KEYCLOAK_URL="http://{{ .Release.Name }}-keycloak"
              echo "Waiting for Keycloak at ${KEYCLOAK_URL} ..."
              until wget -qO- "${KEYCLOAK_URL}/realms/master" > /dev/null 2>&1; do
                echo "  Keycloak not ready yet — retrying in 10 s ..."
                sleep 10
              done
              echo "Keycloak is reachable. Proceeding with realm initialisation."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      # ── Main container: configure realm via kcadm.sh ─────────────────────────
      containers:
        - name: realm-init
          image: quay.io/keycloak/keycloak:26.0
          imagePullPolicy: IfNotPresent
          env:
            # Keycloak admin password — sourced from the pre-created secret.
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-password
                  key: admin-password
            # NOTE: no user passwords here. This Job no longer creates users
            # (Decision 40) — the keycloak-user-passwords Secret is consumed by
            # registry-api (platform-admin) and by the e2e suites (agent-reviewer).
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              KEYCLOAK_URL="http://{{ .Release.Name }}-keycloak"
              REALM="agentshield"

              echo "==> Authenticating as admin against ${KEYCLOAK_URL} ..."
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server "${KEYCLOAK_URL}" \
                --realm master \
                --user admin \
                --password "${KEYCLOAK_ADMIN_PASSWORD}"

              # ── Realm ──────────────────────────────────────────────────────
              # Idempotent: create only if the realm does not already exist.
              echo "==> Creating realm '${REALM}' (idempotent) ..."
              REALM_EXISTS=$(/opt/keycloak/bin/kcadm.sh get realms \
                --fields realm \
                --format csv 2>/dev/null \
                | grep -c "^\"${REALM}\"" || true)

              if [ "${REALM_EXISTS}" -eq 0 ]; then
                /opt/keycloak/bin/kcadm.sh create realms \
                  -s realm="${REALM}" \
                  -s enabled=true \
                  -s displayName="AgentShield"
                echo "    Realm '${REALM}' created."
              else
                echo "    Realm '${REALM}' already exists — skipping creation."
              fi

              # ── Client: registry-api ───────────────────────────────────────
              # Confidential client; service accounts enabled for M2M flows
              # (e.g. Registry API calling other platform services with a JWT).
              echo "==> Creating client 'registry-api' ..."
              CLIENT_EXISTS=$(/opt/keycloak/bin/kcadm.sh get clients \
                -r "${REALM}" --fields clientId --format csv 2>/dev/null \
                | grep -c "^\"registry-api\"" || true)

              if [ "${CLIENT_EXISTS}" -eq 0 ]; then
                /opt/keycloak/bin/kcadm.sh create clients \
                  -r "${REALM}" \
                  -s clientId=registry-api \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s 'redirectUris=["*"]'
                echo "    Client 'registry-api' created."
              else
                echo "    Client 'registry-api' already exists — skipping."
              fi

              # ── Client: envoy-gateway ──────────────────────────────────────
              # Public client consumed by Envoy's JWT filter. Envoy fetches the
              # JWKS from Keycloak and validates tokens inline — no client secret.
              echo "==> Creating client 'envoy-gateway' ..."
              CLIENT_EXISTS=$(/opt/keycloak/bin/kcadm.sh get clients \
                -r "${REALM}" --fields clientId --format csv 2>/dev/null \
                | grep -c "^\"envoy-gateway\"" || true)

              if [ "${CLIENT_EXISTS}" -eq 0 ]; then
                /opt/keycloak/bin/kcadm.sh create clients \
                  -r "${REALM}" \
                  -s clientId=envoy-gateway \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=true \
                  -s 'redirectUris=["*"]'
                echo "    Client 'envoy-gateway' created."
              else
                echo "    Client 'envoy-gateway' already exists — skipping."
              fi

              # ── Client: agentshield-studio ────────────────────────────────
              # Public SPA client. Uses PKCE (S256) — no client secret.
              # Browser redirect flow; all origins/URIs allowed for dev.
              echo "==> Creating client 'agentshield-studio' ..."
              CLIENT_EXISTS=$(/opt/keycloak/bin/kcadm.sh get clients \
                -r "${REALM}" --fields clientId --format csv 2>/dev/null \
                | grep -c "^\"agentshield-studio\"" || true)

              if [ "${CLIENT_EXISTS}" -eq 0 ]; then
                /opt/keycloak/bin/kcadm.sh create clients \
                  -r "${REALM}" \
                  -s clientId=agentshield-studio \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=true \
                  -s standardFlowEnabled=true \
                  -s implicitFlowEnabled=false \
                  -s serviceAccountsEnabled=false \
                  -s 'redirectUris=["*"]' \
                  -s 'webOrigins=["*"]' \
                  -s attributes='{"pkce.code.challenge.method":"S256"}'
                echo "    Client 'agentshield-studio' created."
              else
                echo "    Client 'agentshield-studio' already exists — skipping."
              fi

              # ── Client: langfuse ──────────────────────────────────────────
              # Confidential client for Langfuse SSO (one Keycloak login covers Studio
              # + Langfuse trace links). Wildcard redirect/origins for dev — the exact
              # langfuse host differs per environment (langfuse.127.0.0.1.nip.io on
              # docker-desktop, langfuse.<NLB-IP>.nip.io on EKS). Secret MUST match
              # AUTH_KEYCLOAK_CLIENT_SECRET in values.yaml (langfuse.langfuse.additionalEnv).
              # Chart-managed here so BOTH environments get it (deploy-cpe2e also creates
              # it, idempotently — the first to run wins, the other skips).
              echo "==> Creating client 'langfuse' ..."
              CLIENT_EXISTS=$(/opt/keycloak/bin/kcadm.sh get clients \
                -r "${REALM}" --fields clientId --format csv 2>/dev/null \
                | grep -c "^\"langfuse\"" || true)

              if [ "${CLIENT_EXISTS}" -eq 0 ]; then
                /opt/keycloak/bin/kcadm.sh create clients \
                  -r "${REALM}" \
                  -s clientId=langfuse \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s secret=langfuse-client-secret-2024 \
                  -s standardFlowEnabled=true \
                  -s directAccessGrantsEnabled=true \
                  -s 'redirectUris=["*"]' \
                  -s 'webOrigins=["*"]'
                echo "    Client 'langfuse' created."
              else
                echo "    Client 'langfuse' already exists — skipping."
              fi

              # ── Users ──────────────────────────────────────────────────────
              # NONE, deliberately (Decision 40, phase R0). This Job used to create
              # 'platform-admin' and 'agent-reviewer' with kcadm and wrote NO
              # user_team_assignments row — so the admin existed in Keycloak while
              # the platform had no record of its role, and a realm recreation
              # stranded the hand-seeded row on a dead sub (observed 2026-07-20).
              #
              # Users are now created by platform code, which owns BOTH sides:
              #   platform-admin — services/registry-api/bootstrap_admin.py, run from
              #                    registry-api's lifespan. Looks the user up by
              #                    USERNAME every start, so a recreated realm
              #                    self-heals onto the new sub.
              #   agent-reviewer — created by the e2e suites that need it, through the
              #                    real POST /api/v1/admin/users (FR-10).
              echo "==> Users: none created here — see bootstrap_admin.py (Decision 40)."

              echo "==> Realm initialisation complete."
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
