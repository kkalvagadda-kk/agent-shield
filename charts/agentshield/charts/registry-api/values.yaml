# Default values for registry-api sub-chart.
# These are overridden by the parent agentshield umbrella chart values
# under the `registry-api:` key (see charts/agentshield/values.yaml).

replicaCount: 2

image:
  tag: "0.2.0"
  pullPolicy: IfNotPresent

logLevel: "INFO"

# Failure-alert SMTP transport (Phase 8). Leave host empty to run alerting in
# log-only mode (no email sent). Set host/port/from to enable delivery; provide
# existingSecret (with userKey/passwordKey) for authenticated relays.
smtp:
  host: ""
  port: 25
  from: "alerts@agentshield.local"
  existingSecret: ""
  userKey: "username"
  passwordKey: "password"

langfuseProjectId: ""

# MCP OAuth 2.1 for external servers (Phase 4 WS-2). registry-api runs the authorization-
# code + PKCE dance and needs to know (a) its OWN public callback URL — the redirect_uri it
# registers with every upstream authorization server — and (b) Studio's base URL, which the
# callback 302-redirects the browser back to. BOTH are public, per-env values: leave them
# empty here and the deployment derives them from global.publicUrl (the single source of
# truth, like every other public endpoint) — mcpOauthCallbackUrl becomes
# {global.publicUrl}/api/v1/mcp-servers/oauth/callback and studioBaseUrl becomes
# {global.publicUrl}. Override here only if the callback / Studio live on a different host.
mcpOauthCallbackUrl: ""
studioBaseUrl: ""

# Credential provider (Decision 31 — pluggable credential store). Default
# pg-fernet keeps the value in Postgres (Fernet, behavior-preserving). aws-sm is
# opt-in: the value moves to AWS Secrets Manager, reached via the IRSA role in
# awsRoleArn (annotated on the ServiceAccount, off by default). Leaving these at
# their defaults renders no SA annotation and keeps pg-fernet everywhere.
credentialProvider:
  backend: "pg-fernet"
  awsRegion: ""
  awsSecretsManagerPrefix: ""
  awsRoleArn: ""

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
