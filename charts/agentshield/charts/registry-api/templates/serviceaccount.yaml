apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "registry-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-api.labels" . | nindent 4 }}
  {{- with (.Values.credentialProvider).awsRoleArn }}
  annotations:
    # IRSA — opt-in (Decision 31, aws-sm credential backend). When set, boto3's
    # default credential chain assumes this IAM role to reach AWS Secrets Manager.
    # Empty by default → no annotation rendered, so the pg-fernet path is untouched.
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
