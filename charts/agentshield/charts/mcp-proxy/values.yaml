replicaCount: 1

image:
  repository: registry.internal/agentshield/mcp-proxy
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

# Dedicated namespace holding the per-server MCP credential Secrets
# (agentshield-mcp-server-{id}). Deliberately NOT agentshield-platform so the
# proxy's `get secrets` RBAC (Role/RoleBinding scoped here) provably cannot reach
# the master AGENTSHIELD_ENCRYPTION_KEY Secret (§3b least-privilege). Consumed as
# MCP_SECRETS_NAMESPACE by the proxy and as the target ns of namespace.yaml + rbac.yaml.
secretsNamespace: agentshield-mcp

# Admin plane: registry-api calls POST /internal/discover; the proxy verifies the
# caller's SA subject equals this value (else 403).
registryApiSaSubject: "system:serviceaccount:agentshield-platform:agentshield-registry-api"

# Where the proxy reaches registry-api for the cross-team authorize-tool-call hop.
registryApiUrl: "http://agentshield-registry-api:8000"

# Audience the proxy requires on inbound SA tokens (TokenReview must list it).
proxyAudience: "agentshield-mcp-proxy"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
