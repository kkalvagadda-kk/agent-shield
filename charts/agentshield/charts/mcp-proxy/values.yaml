replicaCount: 1

image:
  repository: registry.internal/agentshield/mcp-proxy
  tag: "0.1.4"   # 0.1.2: P2 WS-C — Keycloak service-identity mint (client secret mount + env) + list_changed knobs. 0.1.1: POST /internal/health reachability probe
  pullPolicy: IfNotPresent

service:
  port: 8080

# Dedicated namespace holding the per-server MCP credential Secrets
# (agentshield-mcp-server-{id}). Deliberately NOT agentshield-platform so the
# proxy's `get secrets` RBAC (Role/RoleBinding scoped here) provably cannot reach
# the master AGENTSHIELD_ENCRYPTION_KEY Secret (§3b least-privilege). Consumed as
# MCP_SECRETS_NAMESPACE by the proxy and as the target ns of namespace.yaml + rbac.yaml.
secretsNamespace: agentshield-mcp

# Admin plane: registry-api calls POST /internal/discover; the proxy verifies the
# caller's SA subject equals this value (else 403).
registryApiSaSubject: "system:serviceaccount:agentshield-platform:agentshield-registry-api"

# Where the proxy reaches registry-api for the cross-team authorize-tool-call hop.
registryApiUrl: "http://agentshield-registry-api:8000"

# Audience the proxy requires on inbound SA tokens (TokenReview must list it).
proxyAudience: "agentshield-mcp-proxy"

# WS-C identity (FR-MCP-21): the proxy mints its OWN Keycloak service-account
# token to present the platform's identity to internal `service_identity` servers.
# It authenticates as a confidential client using a NARROW, file-mounted client
# secret — never the master AGENTSHIELD_ENCRYPTION_KEY and never a k8s get-secrets
# API read for this credential (design §3b least-privilege).
keycloak:
  # Platform Keycloak OpenID token endpoint the client-credentials grant POSTs to.
  # Empty here — the parent chart wires it to the in-cluster Keycloak realm; must be
  # set for any service_identity server to mint a token.
  tokenUrl: ""
  # Confidential Keycloak client the proxy authenticates AS (client-credentials grant).
  clientId: "agentshield-mcp-proxy"
  # The client secret for clientId. Chart materializes it into the K8s Secret
  # {release}-mcp-proxy-keycloak (templates/secret.yaml) and mounts it read-only.
  clientSecret: ""
  # When set, templates/secret.yaml is skipped and the deployment mounts this
  # externally-managed Secret instead (must carry a `client-secret` key).
  existingSecret: ""

# WS-2 external OAuth (Phase 4 / FR-MCP OAuth): for an EXTERNAL server registered with
# external_auth_mode=oauth, the proxy pulls a short-lived upstream ACCESS token from
# registry-api (which owns the refresh token + the refresh-with-rotation) and presents it
# upstream. The proxy holds NO refresh token / DB / master key — it authenticates the pull
# with a projected SA token (audience agentshield-registry-api; see deployment.yaml) and
# caches the access token in memory only.
oauth:
  # registry-api endpoint the proxy POSTs {server_id, user_sub} to for a fresh access
  # token. Same in-cluster registry-api Service/port as registryApiUrl above (8000). Set
  # per-env only if registry-api is reached at a different address (it is not on EKS — the
  # in-cluster Service name/port is identical there). Path is fixed by the API contract.
  registryApiTokenUrl: "http://agentshield-registry-api:8000/api/v1/internal/mcp/oauth/access-token"
  # Serve a cached access token until this many seconds before its exp (safety skew).
  accessTokenCacheSkewSeconds: 30

# WS-B list_changed subscription (FR-MCP-07): the proxy holds a long-lived session
# per server that supports notifications/tools/list_changed and POSTs a debounced
# re-sync callback to registry-api when the upstream tool set changes.
listChanged:
  # Master switch — when false the subscription manager is a no-op.
  enabled: true
  # Trailing-edge debounce (seconds) — coalesce a burst of notifications into one POST.
  debounceSeconds: 5
  # Backoff (seconds) between reconnect attempts after a subscription session drops.
  reconnectBackoffSeconds: 10
  # After this many consecutive failed reconnects the subscriber tears itself down.
  maxReconnectAttempts: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
