apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Own SA — carries only `system:auth-delegator` (TokenReview) + `get secrets`
      # in agentshield-mcp (see rbac.yaml). Never the DB, never AGENTSHIELD_ENCRYPTION_KEY.
      serviceAccountName: {{ .Release.Name }}-mcp-proxy
      {{- with ((.Values.global).imagePullSecrets | default list) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # Namespace the proxy reads per-server credential Secrets from (get-only RBAC).
            - name: MCP_SECRETS_NAMESPACE
              value: {{ .Values.secretsNamespace | quote }}
            # registry-api base URL for the cross-team authorize-tool-call hop.
            - name: REGISTRY_API_URL
              value: {{ .Values.registryApiUrl | quote }}
            # Audience the proxy requires on inbound SA tokens (TokenReview).
            - name: MCP_PROXY_AUDIENCE
              value: {{ .Values.proxyAudience | quote }}
            # /internal/discover is admin-plane: caller subject must equal this.
            - name: REGISTRY_API_SA_SUBJECT
              value: {{ .Values.registryApiSaSubject | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
