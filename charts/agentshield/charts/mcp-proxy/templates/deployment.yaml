apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Own SA — carries only `system:auth-delegator` (TokenReview) + `get secrets`
      # in agentshield-mcp (see rbac.yaml). Never the DB, never AGENTSHIELD_ENCRYPTION_KEY.
      serviceAccountName: {{ .Release.Name }}-mcp-proxy
      {{- with ((.Values.global).imagePullSecrets | default list) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # Namespace the proxy reads per-server credential Secrets from (get-only RBAC).
            - name: MCP_SECRETS_NAMESPACE
              value: {{ .Values.secretsNamespace | quote }}
            # registry-api base URL for the cross-team authorize-tool-call hop.
            - name: REGISTRY_API_URL
              value: {{ .Values.registryApiUrl | quote }}
            # Audience the proxy requires on inbound SA tokens (TokenReview).
            - name: MCP_PROXY_AUDIENCE
              value: {{ .Values.proxyAudience | quote }}
            # /internal/discover is admin-plane: caller subject must equal this.
            - name: REGISTRY_API_SA_SUBJECT
              value: {{ .Values.registryApiSaSubject | quote }}
            # WS-C identity (FR-MCP-21): the proxy mints its OWN service-account
            # token for internal `service_identity` servers via a NARROW,
            # file-mounted Keycloak client secret (never the master key / DB).
            - name: KEYCLOAK_TOKEN_URL
              value: {{ .Values.keycloak.tokenUrl | quote }}
            - name: MCP_PROXY_KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: MCP_PROXY_KEYCLOAK_CLIENT_SECRET_PATH
              value: "/var/run/secrets/mcp-proxy-keycloak/client-secret"
            # WS-B list_changed subscription knobs (FR-MCP-07).
            - name: MCP_LIST_CHANGED_ENABLED
              value: {{ .Values.listChanged.enabled | quote }}
            - name: MCP_LIST_CHANGED_DEBOUNCE_SECONDS
              value: {{ .Values.listChanged.debounceSeconds | quote }}
            - name: MCP_LIST_CHANGED_RECONNECT_BACKOFF_SECONDS
              value: {{ .Values.listChanged.reconnectBackoffSeconds | quote }}
            - name: MCP_LIST_CHANGED_MAX_RECONNECT_ATTEMPTS
              value: {{ .Values.listChanged.maxReconnectAttempts | quote }}
            # WS-2 external OAuth (Phase 4): for an EXTERNAL server registered with
            # external_auth_mode=oauth the proxy PULLS a short-lived upstream access
            # token from registry-api (which owns the refresh token + refresh-with-
            # rotation) and presents it upstream. It holds NO refresh token / DB /
            # master key — only the projected agentshield-registry-api SA token below
            # authenticates the pull (registry-api TokenReviews it + pins the proxy SA).
            - name: REGISTRY_API_OAUTH_TOKEN_URL
              value: {{ .Values.oauth.registryApiTokenUrl | quote }}
            - name: MCP_PROXY_REGISTRY_API_TOKEN_PATH
              value: "/var/run/secrets/registry-api/token"
            - name: OAUTH_ACCESS_TOKEN_CACHE_SKEW_SECONDS
              value: {{ .Values.oauth.accessTokenCacheSkewSeconds | quote }}
          volumeMounts:
            # Read-only mount of the Keycloak client secret (WS-C). The proxy reads
            # it from disk on each mint — NOT via the k8s get-secrets API (§3b).
            - name: mcp-proxy-keycloak
              mountPath: /var/run/secrets/mcp-proxy-keycloak
              readOnly: true
            # WS-2 (Phase 4): projected SA token (audience agentshield-registry-api)
            # the proxy presents to registry-api's /internal/mcp/oauth/access-token
            # endpoint. Read fresh from disk on each pull; NOT via the k8s API. §3b.
            - name: registry-api-token
              mountPath: /var/run/secrets/registry-api
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # The Keycloak client secret: the operator-supplied Secret when
        # .Values.keycloak.existingSecret is set, else the chart-managed
        # {{ .Release.Name }}-mcp-proxy-keycloak (templates/secret.yaml).
        - name: mcp-proxy-keycloak
          secret:
            secretName: {{ .Values.keycloak.existingSecret | default (printf "%s-mcp-proxy-keycloak" .Release.Name) }}
        # WS-2 (Phase 4): projected bound SA token (audience agentshield-registry-api,
        # TTL 1h) so the proxy can authenticate to registry-api's OAuth access-token
        # endpoint. The SYMMETRIC mirror of registry-api's agentshield-mcp-proxy
        # projected token (registry-api deployment.yaml) — that endpoint TokenReviews
        # this token (spec.audiences=[agentshield-registry-api]) and pins the subject
        # to the mcp-proxy SA. Without it every OAuth access-token pull 401s.
        - name: registry-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentshield-registry-api
                  expirationSeconds: 3600
                  path: token
