{{- /*
Keycloak confidential-client secret for the proxy's service-identity mint (WS-C /
FR-MCP-21). Holds ONLY the `client-secret` for MCP_PROXY_KEYCLOAK_CLIENT_ID — a
NARROW, file-mounted credential the proxy reads from disk (never the master
AGENTSHIELD_ENCRYPTION_KEY, never via the k8s get-secrets API — design §3b).

Rendered ONLY when the operator has NOT supplied their own Secret via
.Values.keycloak.existingSecret. When existingSecret is set, this template is
skipped and deployment.yaml mounts that externally-managed Secret instead.
*/}}
{{- if not .Values.keycloak.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mcp-proxy-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  client-secret: {{ .Values.keycloak.clientSecret | quote }}
{{- end }}
