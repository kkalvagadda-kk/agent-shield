# Isolated UX-preview deployment for the SCHEDULE LIFECYCLE design.
# Namespace studio-schedule-preview — no references to any platform service.
#
# Sibling of preview-deploy.yaml (namespace studio-ux-preview, the conversation /
# chat / knowledge preview). Both run the SAME demo image: `vite build --mode demo`
# produces one bundle containing every preview screen, so the two namespaces are
# two independent entry points into identical bytes, not two builds. Keeping them
# separate means either can be torn down, port-forwarded, or shared without
# touching the other.
#
# Why this can run standalone at all, when the Helm chart cannot: the demo image
# ships nginx.demo.conf, which has NO `/api` or `/realms` proxy_pass. The chart's
# studio nginx template proxies to bare `<release>-registry-api` and
# `<release>-keycloak` with no `resolver`, so nginx exits with
# "[emerg] host not found in upstream" in any namespace that lacks them. Demo mode
# also skips initKeycloak() entirely (main.tsx), so there is no login, no realm and
# no secret to provision.
#
# Image loading: this is a kind-backed cluster (nodes desktop-control-plane /
# desktop-worker run their own containerd), so a host `docker build` is NOT
# automatically visible. After each rebuild, bump the tag (never reuse one —
# IfNotPresent will serve the stale cached layer) and load it into the nodes:
#
#   cd studio && docker build -f Dockerfile.demo -t studio:ux-preview-N .
#   docker save studio:ux-preview-N -o /tmp/s.tar
#   for n in desktop-worker desktop-control-plane; do \
#     docker exec -i $n ctr -n k8s.io images import - < /tmp/s.tar; done
#
# Reach it with:
#   kubectl port-forward -n studio-schedule-preview svc/studio-preview 8081:80
#   open http://localhost:8081/preview/schedules
apiVersion: v1
kind: Namespace
metadata:
  name: studio-schedule-preview
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-preview
  namespace: studio-schedule-preview
  labels: { app: studio-preview }
spec:
  replicas: 1
  selector:
    matchLabels: { app: studio-preview }
  template:
    metadata:
      labels: { app: studio-preview }
    spec:
      containers:
        - name: studio
          image: studio:ux-preview-5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: studio-preview
  namespace: studio-schedule-preview
spec:
  type: ClusterIP
  selector: { app: studio-preview }
  ports:
    - port: 80
      targetPort: 80
      name: http
